name: RuleTrip Harness Canary
description: Plant controlled failures in disposable worktrees and prove your repository guardrails reject them.
author: Dean Egan

branding:
  icon: activity
  color: orange

inputs:
  config:
    description: Path to the RuleTrip JSON configuration file.
    required: false
    default: .ruletrip.json
  report_dir:
    description: Directory for Markdown, JSON, SARIF, and JUnit reports.
    required: false
    default: ruletrip-report
  fail_on:
    description: Comma-separated outcomes that fail the step (dead, broken, inconclusive).
    required: false
    default: dead,broken,inconclusive

outputs:
  conclusion:
    description: Overall RuleTrip conclusion.
  alive:
    description: Number of canaries rejected by their guard.
  dead:
    description: Number of canaries that escaped with a zero exit code.
  broken:
    description: Number of guards whose clean baseline failed.
  inconclusive:
    description: Number of canaries or guards that could not be classified safely.
  sensors_configured:
    description: Number of canaries with literal output sensors.
  sensors_matched:
    description: Number of configured sensors absent on every clean control and matched in every mutation run.
  sensors_missing:
    description: Number of configured sensors absent on clean controls but missing from one or more mutation runs.
  sensors_unattributed:
    description: Number of configured sensors whose absence could not be established on clean controls.
  exit_only:
    description: Number of canaries classified from process exits without a sensor.
  json_report:
    description: Path to the JSON report.
  sarif_report:
    description: Path to the SARIF report.
  junit_report:
    description: Path to the JUnit XML report.
  markdown_report:
    description: Path to the Markdown summary.

runs:
  using: node24
  main: src/action.js

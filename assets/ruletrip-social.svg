<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RuleTrip social preview</title>
  <desc id="desc">RuleTrip branding with a shield, tripwire pulse, and the phrase trip the guardrail before trusting the green.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b13"/>
      <stop offset="0.62" stop-color="#111827"/>
      <stop offset="1" stop-color="#1d1408"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243047"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#background)"/>
  <path d="M0 88H1280M0 552H1280" stroke="#273244" stroke-width="2"/>
  <path d="M0 112H1280M0 528H1280" stroke="#1b2433" stroke-width="1"/>

  <g transform="translate(78 126) scale(1.45)">
    <path d="M128 14 224 48v67c0 61-35 104-96 127-61-23-96-66-96-127V48Z" fill="url(#shield)" stroke="#475569" stroke-width="8"/>
    <path d="M44 142h60l14-45 23 82 17-55h54" fill="none" stroke="url(#wire)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="44" cy="142" r="12" fill="#f97316"/>
    <circle cx="212" cy="124" r="12" fill="#f97316"/>
    <path d="m99 67 20 20 39-42" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="500" y="225" fill="#f8fafc" font-size="98" font-weight="800" letter-spacing="-3">RuleTrip</text>
    <text x="505" y="286" fill="#fbbf24" font-size="26" font-weight="700">TRIP THE GUARDRAIL BEFORE TRUSTING THE GREEN.</text>
    <text x="505" y="342" fill="#b8c2d1" font-size="27">Mutation testing for repository feedback controls.</text>

    <g transform="translate(505 400)" font-size="16" font-weight="700">
      <rect width="220" height="48" rx="24" fill="#172033" stroke="#f59e0b" stroke-width="2"/>
      <text x="110" y="31" text-anchor="middle" fill="#fbbf24">SENSOR ATTRIBUTION</text>
      <rect x="236" width="246" height="48" rx="24" fill="#172033" stroke="#22c55e" stroke-width="2"/>
      <text x="359" y="31" text-anchor="middle" fill="#4ade80">REPEAT CONFIRMATION</text>
      <rect x="498" width="190" height="48" rx="24" fill="#172033" stroke="#64748b" stroke-width="2"/>
      <text x="593" y="31" text-anchor="middle" fill="#d8dee9">ZERO DEPENDENCIES</text>
    </g>

    <text x="505" y="505" fill="#7f8da3" font-size="23">github.com/Dean00dev/RuleTrip</text>
  </g>
</svg>

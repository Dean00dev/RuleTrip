name: Bug report
description: Report incorrect, unsafe, or surprising RuleTrip behaviour.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source, or vulnerability details. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: RuleTrip version or commit
      placeholder: v0.1.0 or a full SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal configuration
      description: Remove private paths and source. Include only the smallest safe reproduction.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
